<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc">
  <title id="title">vinialx GitHub profile card</title>
  <desc id="desc">Terminal-inspired GitHub profile with stats, languages, contribution graph and pinned repositories.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d10"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <clipPath id="avatarClip">
      <circle cx="128" cy="133" r="62"/>
    </clipPath>
  </defs>

  <rect width="1200" height="1060" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="1058" rx="27" fill="none" stroke="#2a3240"/>

  <circle cx="34" cy="30" r="6" fill="#ff5f57"/>
  <circle cx="54" cy="30" r="6" fill="#febc2e"/>
  <circle cx="74" cy="30" r="6" fill="#28c840"/>
  <text x="600" y="35" text-anchor="middle" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">vinialx@github:~</text>

  <circle cx="128" cy="133" r="66" fill="#171d26" stroke="#303a49" stroke-width="2"/>
  <image href="https://github.com/vinialx.png?size=200" x="66" y="71" width="124" height="124" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatarClip)"/>

  <text x="225" y="105" fill="#f9fafb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="700">vinialx</text>
  <text x="225" y="140" fill="#a7b0be" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">Software Developer · Open Source</text>
  <text x="225" y="174" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">&gt; building practical software and learning closer to the metal</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <rect x="70" y="226" width="190" height="38" rx="10" fill="#151b23" stroke="#2a3442"/>
    <text x="165" y="250" text-anchor="middle" fill="#e5e7eb">TypeScript / JavaScript</text>
    <rect x="274" y="226" width="78" height="38" rx="10" fill="#151b23" stroke="#2a3442"/>
    <text x="313" y="250" text-anchor="middle" fill="#e5e7eb">Go</text>
    <rect x="366" y="226" width="100" height="38" rx="10" fill="#151b23" stroke="#2a3442"/>
    <text x="416" y="250" text-anchor="middle" fill="#e5e7eb">Python</text>
    <rect x="480" y="226" width="88" height="38" rx="10" fill="#151b23" stroke="#2a3442"/>
    <text x="524" y="250" text-anchor="middle" fill="#fde68a">C ↗</text>
    <rect x="582" y="226" width="96" height="38" rx="10" fill="#151b23" stroke="#2a3442"/>
    <text x="630" y="250" text-anchor="middle" fill="#fde68a">Lua ↗</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="70" y="294" width="250" height="104" rx="16" fill="#10151c" stroke="#283240"/>
    <text x="92" y="324" fill="#7b8797" font-size="14">CONTRIBUTIONS</text>
    <text id="contributions" x="92" y="368" fill="#f9fafb" font-size="32" font-weight="700">--</text>
    <text x="92" y="387" fill="#64748b" font-size="12">last 12 months</text>

    <rect x="340" y="294" width="250" height="104" rx="16" fill="#10151c" stroke="#283240"/>
    <text x="362" y="324" fill="#7b8797" font-size="14">PUBLIC REPOS</text>
    <text id="repos" x="362" y="368" fill="#f9fafb" font-size="32" font-weight="700">--</text>

    <rect x="610" y="294" width="250" height="104" rx="16" fill="#10151c" stroke="#283240"/>
    <text x="632" y="324" fill="#7b8797" font-size="14">TOTAL STARS</text>
    <text id="stars" x="632" y="368" fill="#f9fafb" font-size="32" font-weight="700">--</text>

    <rect x="880" y="294" width="250" height="104" rx="16" fill="#10151c" stroke="#283240"/>
    <text x="902" y="324" fill="#7b8797" font-size="14">FOLLOWERS</text>
    <text id="followers" x="902" y="368" fill="#f9fafb" font-size="32" font-weight="700">--</text>
  </g>

  <text x="70" y="438" fill="#7b8797" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">LANGUAGES · BY BYTES OF CODE</text>
  <g id="language-bars">
    <rect x="70" y="458" width="1060" height="18" rx="9" fill="#151b23"/>
    <text x="70" y="505" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">Language data appears after the first workflow run.</text>
  </g>

  <text x="70" y="556" fill="#7b8797" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">CONTRIBUTION GRAPH · LAST 12 MONTHS</text>
  <g id="contribution-graph">
    <text x="70" y="594" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">Contribution graph appears after the first workflow run.</text>
  </g>

  <text x="70" y="760" fill="#7b8797" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">PINNED REPOSITORIES</text>
  <g id="pinned-repos">
    <text x="70" y="798" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">Pinned repositories appear after the first workflow run.</text>
  </g>

  <text x="70" y="1006" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">git · docker · linux · nix · postgres · mssql · mysql</text>
  <text x="70" y="1038" fill="#22c55e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">vinialx@github ~ $</text>
  <text x="236" y="1038" fill="#e5e7eb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">open_source --contribute</text>
</svg>
